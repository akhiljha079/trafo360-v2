# Development/testing compose stack. See docs/deployment.md for the
# production layout (real NFS mount, real TLS cert, separate DB host, etc).
name: trafo360

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: trafo360
      POSTGRES_PASSWORD: ${DB_PASSWORD:-trafo360}
      POSTGRES_DB: trafo360
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trafo360"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://trafo360:${DB_PASSWORD:-trafo360}@postgres:5432/trafo360?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - local_storage:/var/trafo360/local-storage
      - nfs_storage:/mnt/company-document-storage
    ports:
      - "4000:4000"

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://trafo360:${DB_PASSWORD:-trafo360}@postgres:5432/trafo360?schema=public
      # Container-network name, not localhost - see .env.example.
      API_INTERNAL_URL: http://api:4000
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_started
    volumes:
      - local_storage:/var/trafo360/local-storage
      - nfs_storage:/mnt/company-document-storage
      - whatsapp_session:/var/trafo360/whatsapp-session

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    ports:
      - "8080:80"

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - api
      - web
    volumes:
      - ./nginx/trafo360.conf.example:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"

volumes:
  postgres_data:
  local_storage:
  # In production this is a real NFS mount bound in via the host, not a
  # named Docker volume - see docs/nfs-setup.md.
  nfs_storage:
  whatsapp_session:
