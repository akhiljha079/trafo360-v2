name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: trafo360_test
          MYSQL_USER: trafo360_test
          MYSQL_PASSWORD: trafo360_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_NAME: trafo360_test
      DB_USER: trafo360_test
      DB_PASSWORD: trafo360_test
      SESSION_SECRET: ci_test_session_secret
      NODE_ENV: test
      ADMIN_NAME: CI Admin
      ADMIN_EMAIL: admin@ci.local
      ADMIN_PASSWORD: CiAdmin123!

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Write .env.test for the suite
        run: |
          cat > .env.test <<EOF
          DB_HOST=$DB_HOST
          DB_PORT=$DB_PORT
          DB_NAME=$DB_NAME
          DB_USER=$DB_USER
          DB_PASSWORD=$DB_PASSWORD
          SESSION_SECRET=$SESSION_SECRET
          NODE_ENV=$NODE_ENV
          ADMIN_NAME=$ADMIN_NAME
          ADMIN_EMAIL=$ADMIN_EMAIL
          ADMIN_PASSWORD=$ADMIN_PASSWORD
          EOF

      - run: npm test
